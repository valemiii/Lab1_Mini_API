services:
  - type: web
    name: apdaf-lab3-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apdaf-lab3-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 4h
      - key: NODE_ENV
        value: production
databases:
  - name: apdaf-lab3-db
    plan: starter
