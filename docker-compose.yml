# PostgreSQL 17 local existente (opcional; el proyecto usa PostgreSQL en Supabase).
# Para este laboratorio, levanta solo MongoDB: docker compose up -d mongodb
services:
  postgres:
    image: postgres:17-alpine
    container_name: lab2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: espe_user
      POSTGRES_PASSWORD: espe_password
      POSTGRES_DB: lab2_apdaf
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-apdaf_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-apdaf_local_password}
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  postgres_data:
  mongodb_data:
